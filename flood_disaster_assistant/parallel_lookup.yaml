# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
name: parallel_lookup
agent_class: ParallelAgent
description: >-
  Runs the independent incident-status, safety-guidance and relief-point
  lookups at the same time. Each branch writes its own result to state.
sub_agents:
  - config_path: incident_lookup_agent.yaml
  - config_path: safety_guidance_agent.yaml
  - config_path: relief_lookup_agent.yaml
