# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
name: assistance_pipeline
agent_class: SequentialAgent
description: >-
  Handles every supported disaster-recovery request in order: intake (bounded
  loop), issue classification, parallel incident / safety / relief lookups,
  and the final grounded response.
sub_agents:
  - config_path: intake_loop.yaml
  - config_path: issue_classifier_agent.yaml
  - config_path: parallel_lookup.yaml
  - config_path: response_agent.yaml
